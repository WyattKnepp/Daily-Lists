<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Daily Lists" />
  <meta name="theme-color" content="#000000" />
  <title>Daily Lists</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #000000;
      --surface:     #050f05;
      --border:      #0f2e0f;
      --accent:      #00ff41;
      --accent-dim:  #00aa2a;
      --text:        #b8ffb8;
      --muted:       #2e6b2e;
      --danger:      #ff3c3c;
      --glow:        0 0 8px rgba(0,255,65,0.45);
      --glow-sm:     0 0 4px rgba(0,255,65,0.3);
      --safe-top:    env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', 'Courier New', monospace;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
    }

    /* ── Header ── */
    header {
      padding: 24px 20px 0;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .eyebrow {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--accent);
      text-shadow: var(--glow);
      margin-bottom: 4px;
    }

    h1 {
      font-family: 'DM Mono', monospace;
      font-size: 24px;
      font-weight: 500;
      line-height: 1;
      color: var(--accent);
      text-shadow: var(--glow);
      word-break: break-all;
    }

    .subtitle {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      padding-top: 2px;
      flex-shrink: 0;
      margin-left: 10px;
    }

    .icon-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 8px;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      transition: color 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }

    .icon-btn:active { opacity: 0.7; }
    .icon-btn.danger { color: var(--danger); border-color: #3a0f0f; background: #0f0505; }

    /* ── Tab bar ── */
    .tab-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 0 0 12px;
      scrollbar-width: none;
    }

    .tab-bar::-webkit-scrollbar { display: none; }

    .tab {
      flex-shrink: 0;
      padding: 6px 14px;
      border-radius: 4px;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      transition: color 0.15s, border-color 0.15s, background 0.15s, box-shadow 0.15s;
      white-space: nowrap;
    }

    .tab.active {
      background: transparent;
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 500;
      box-shadow: var(--glow-sm), inset 0 0 12px rgba(0,255,65,0.06);
      text-shadow: var(--glow-sm);
    }

    .tab-new {
      flex-shrink: 0;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      border: 1px dashed var(--border);
      background: transparent;
      color: var(--muted);
      transition: color 0.15s, border-color 0.15s;
      font-family: 'DM Mono', monospace;
    }

    .tab-new:active { opacity: 0.6; }

    /* ── Progress ── */
    .progress-wrap {
      padding: 14px 20px 8px;
    }

    .progress-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .progress-label { font-size: 11px; color: var(--muted); letter-spacing: 0.1em; }

    .progress-count {
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      color: var(--accent);
      text-shadow: var(--glow-sm);
    }

    .bar-bg { height: 2px; background: var(--border); border-radius: 0; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--accent); border-radius: 0; transition: width 0.3s ease; box-shadow: var(--glow); }

    /* ── Main ── */
    main {
      flex: 1;
      padding: 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
    }

    /* ── Items ── */
    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 3px;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.1s, box-shadow 0.15s;
      -webkit-user-select: none;
      user-select: none;
      animation: slideIn 0.18s ease both;
    }

    .item:active { transform: scale(0.98); }
    .item.checked { border-color: #0a1e0a; }
    .item:not(.checked):hover { border-color: var(--accent-dim); box-shadow: var(--glow-sm); }

    .checkbox {
      width: 22px;
      height: 22px;
      border: 1.5px solid var(--muted);
      border-radius: 6px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s;
    }

    .item.checked .checkbox { background: transparent; border-color: var(--accent); box-shadow: var(--glow-sm); }

    .checkmark { opacity: 0; transform: scale(0.5); transition: opacity 0.15s, transform 0.15s; }
    .item.checked .checkmark { opacity: 1; transform: scale(1); }

    .item-label {
      font-size: 14px;
      color: var(--text);
      transition: color 0.15s;
      flex: 1;
      word-break: break-word;
    }

    .item.checked .item-label { color: var(--muted); text-decoration: line-through; }

    .del-btn {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--danger);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
      line-height: 1;
      opacity: 0.6;
    }

    .del-btn:active { background: #2a0f0f; opacity: 1; }

    /* ── Empty / state ── */
    .empty, .state-msg {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      padding-bottom: 60px;
    }

    .empty-icon { font-size: 36px; margin-bottom: 4px; }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: calc(76px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: #100505;
      border: 1px solid var(--danger);
      color: #ff9090;
      padding: 10px 16px;
      border-radius: 3px;
      font-size: 12px;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      z-index: 100;
      white-space: nowrap;
      max-width: calc(100vw - 40px);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Add row ── */
    .add-row {
      display: flex;
      gap: 10px;
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      background: var(--bg);
      position: sticky;
      bottom: 0;
    }

    input[type="text"] {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 12px 14px;
      font-family: 'DM Mono', monospace;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      -webkit-appearance: none;
      caret-color: var(--accent);
    }

    input[type="text"]::placeholder { color: var(--muted); }
    input[type="text"]:focus { border-color: var(--accent-dim); box-shadow: var(--glow-sm); }

    button.add-btn {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 3px;
      padding: 12px 18px;
      font-family: 'DM Mono', monospace;
      font-weight: 500;
      font-size: 20px;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s, box-shadow 0.15s;
      flex-shrink: 0;
      text-shadow: var(--glow-sm);
      box-shadow: var(--glow-sm);
    }

    button.add-btn:active { opacity: 0.8; transform: scale(0.96); }
    button.add-btn:disabled { opacity: 0.2; pointer-events: none; box-shadow: none; text-shadow: none; }

    /* ── Scanlines ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.07) 2px,
        rgba(0,0,0,0.07) 4px
      );
      pointer-events: none;
      z-index: 999;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <div style="min-width:0;flex:1">
        <div class="eyebrow">Daily Lists</div>
        <h1 id="active-title">—</h1>
        <div class="subtitle" id="date-label"></div>
      </div>
      <div class="header-actions">
        <button class="icon-btn danger" id="delete-list-btn" title="Delete list" style="display:none">
          <svg width="14" height="15" viewBox="0 0 14 15" fill="none">
            <path d="M1 3.5h12M5 3.5V2.5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1M11.5 3.5l-.8 8.5a1 1 0 0 1-1 .9H4.3a1 1 0 0 1-1-.9L2.5 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="tab-bar" id="tab-bar">
      <button class="tab-new" id="new-list-btn">+ new list</button>
    </div>
  </header>

  <div class="progress-wrap" id="progress-wrap" style="display:none">
    <div class="progress-row">
      <span class="progress-label">PROGRESS</span>
      <span class="progress-count" id="progress-count">0 / 0</span>
    </div>
    <div class="bar-bg"><div class="bar-fill" id="bar" style="width:0%"></div></div>
  </div>

  <main id="list">
    <div class="state-msg">Connecting…</div>
  </main>

  <div class="add-row">
    <input type="text" id="new-item" placeholder="Add an item…" maxlength="120"
           autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false" />
    <button class="add-btn" id="add-btn" disabled>+</button>
  </div>

  <div id="toast"></div>

  <script>
    // ─── Config ──────────────────────────────────────────────────────────────
    const API_BASE = 'http://165.245.138.56:3001';
    const TOKEN    = 'password';

    // ─── State ───────────────────────────────────────────────────────────────
    let lists      = [];   // string[]
    let activeList = null; // string | null
    let items      = [];   // { id, label, checked }[]

    // ─── API helpers ─────────────────────────────────────────────────────────
    const AUTH = { 'x-token': TOKEN, 'Content-Type': 'application/json' };

    async function apiFetch(path, opts = {}) {
      const res = await fetch(API_BASE + path, {
        ...opts,
        headers: { ...AUTH, ...(opts.headers || {}) }
      });
      if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
      return res;
    }

    const api = {
      lists:  ()           => apiFetch('/lists').then(r => r.json()),
      get:    name         => apiFetch(`/list/${enc(name)}`).then(r => r.text()),
      put:    (name, body) => apiFetch(`/list/${enc(name)}`, { method: 'PUT', body: JSON.stringify({ content: body }) }),
      delete: name         => apiFetch(`/list/${enc(name)}`, { method: 'DELETE' }),
    };

    function enc(s) { return encodeURIComponent(s); }

    // ─── Markdown ────────────────────────────────────────────────────────────
    function parseMd(md) {
      let id = 0;
      return md.split('\n')
        .filter(l => /^- \[[ x]\] /.test(l))
        .map(l => ({ id: ++id, checked: l[3] === 'x', label: l.slice(6) }));
    }

    function toMd(arr) {
      return arr.map(i => `- [${i.checked ? 'x' : ' '}] ${i.label}`).join('\n');
    }

    // ─── Toast ───────────────────────────────────────────────────────────────
    let toastTimer;
    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
    }

    // ─── Date helpers ────────────────────────────────────────────────────────
    function todayKey() {
      const d = new Date();
      return `${d.getMonth() + 1}-${d.getDate()}-${String(d.getFullYear()).slice(2)}`;
    }

    function parseListDate(name) {
      const m = name.match(/^(\d{1,2})-(\d{1,2})-(\d{2})$/);
      if (!m) return null;
      return new Date(2000 + parseInt(m[3]), parseInt(m[1]) - 1, parseInt(m[2]));
    }

    function pickDefault(names) {
      const key = todayKey();
      if (names.includes(key)) return key;

      const today = new Date(); today.setHours(0, 0, 0, 0);
      const dated = names
        .map(n => ({ n, d: parseListDate(n) }))
        .filter(x => x.d)
        .sort((a, b) => b.d - a.d);

      const past = dated.filter(x => x.d <= today);
      if (past.length) return past[0].n;
      if (dated.length) return dated[dated.length - 1].n;
      return names[0];
    }

    // ─── Init ────────────────────────────────────────────────────────────────
    async function init() {
      document.getElementById('date-label').textContent =
        new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

      try {
        lists = await api.lists();
        renderTabs();
        if (lists.length > 0) {
          await switchList(pickDefault(lists));
        } else {
          setMain('<div class="empty"><div class="empty-icon">📋</div>No lists yet.<br>Tap "+ new list" to create one.</div>');
        }
      } catch (e) {
        setMain('<div class="state-msg">⚠️ Could not reach API</div>');
        toast('Connection error: ' + e.message);
      }
    }

    // ─── Tabs ────────────────────────────────────────────────────────────────
    function renderTabs() {
      const bar  = document.getElementById('tab-bar');
      const nBtn = document.getElementById('new-list-btn');
      bar.querySelectorAll('.tab').forEach(t => t.remove());

      lists.forEach(name => {
        const tab = document.createElement('button');
        tab.className = 'tab' + (name === activeList ? ' active' : '');
        tab.textContent = name;
        tab.addEventListener('click', () => switchList(name));
        bar.insertBefore(tab, nBtn);
      });

      document.getElementById('delete-list-btn').style.display = activeList ? 'flex' : 'none';

      // Scroll active tab into view
      const activeTab = bar.querySelector('.tab.active');
      if (activeTab) activeTab.scrollIntoView({ inline: 'nearest', behavior: 'smooth' });
    }

    // ─── Switch list ─────────────────────────────────────────────────────────
    async function switchList(name) {
      activeList = name;
      document.getElementById('active-title').textContent = name;
      document.getElementById('add-btn').disabled = false;
      document.getElementById('progress-wrap').style.display = 'none';
      renderTabs();
      setMain('<div class="state-msg">Loading…</div>');

      try {
        const md = await api.get(name);
        items = parseMd(md);
        renderItems();
      } catch (e) {
        setMain('<div class="state-msg">⚠️ Failed to load list</div>');
        toast('Load error: ' + e.message);
      }
    }

    // ─── Render items ────────────────────────────────────────────────────────
    function renderItems() {
      const list = document.getElementById('list');
      list.innerHTML = '';

      if (items.length === 0) {
        list.innerHTML = '<div class="empty"><div class="empty-icon">✓</div>Empty list.<br>Add something below.</div>';
        document.getElementById('progress-wrap').style.display = 'none';
        return;
      }

      items.forEach((item, idx) => {
        const el = document.createElement('div');
        el.className = 'item' + (item.checked ? ' checked' : '');
        el.style.animationDelay = `${idx * 20}ms`;
        el.innerHTML = `
          <div class="checkbox">
            <svg class="checkmark" width="12" height="10" viewBox="0 0 12 10" fill="none">
              <path d="M1 5l3.5 3.5L11 1" stroke="#00ff41" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <span class="item-label">${esc(item.label)}</span>
          <button class="del-btn" aria-label="Delete">×</button>
        `;
        el.addEventListener('click', e => {
          if (!e.target.closest('.del-btn')) toggle(item.id);
        });
        el.querySelector('.del-btn').addEventListener('click', e => {
          e.stopPropagation();
          removeItem(item.id);
        });
        list.appendChild(el);
      });

      const total = items.length;
      const done  = items.filter(i => i.checked).length;
      document.getElementById('progress-count').textContent = `${done} / ${total}`;
      document.getElementById('bar').style.width = total ? `${(done / total) * 100}%` : '0%';
      document.getElementById('progress-wrap').style.display = 'block';
    }

    // ─── Toggle ──────────────────────────────────────────────────────────────
    async function toggle(id) {
      const item = items.find(i => i.id === id);
      if (!item) return;
      item.checked = !item.checked;
      renderItems();
      await persist();
    }

    // ─── Delete item ─────────────────────────────────────────────────────────
    async function removeItem(id) {
      items = items.filter(i => i.id !== id);
      renderItems();
      await persist();
    }

    // ─── Add item ────────────────────────────────────────────────────────────
    const newItemInput = document.getElementById('new-item');

    async function addItem() {
      const label = newItemInput.value.trim();
      if (!label || !activeList) return;
      const maxId = items.reduce((m, i) => Math.max(m, i.id), 0);
      items.push({ id: maxId + 1, label, checked: false });
      newItemInput.value = '';
      renderItems();
      document.getElementById('list').lastElementChild?.scrollIntoView({ behavior: 'smooth' });
      await persist();
    }

    document.getElementById('add-btn').addEventListener('click', addItem);
    newItemInput.addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); });

    // ─── Persist ─────────────────────────────────────────────────────────────
    async function persist() {
      if (!activeList) return;
      try {
        await api.put(activeList, toMd(items));
      } catch (e) {
        toast('Save error: ' + e.message);
      }
    }

    // ─── New list ────────────────────────────────────────────────────────────
    document.getElementById('new-list-btn').addEventListener('click', async () => {
      const name = prompt('New list name:', todayKey());
      if (!name?.trim()) return;
      const trimmed = name.trim();

      if (lists.includes(trimmed)) { await switchList(trimmed); return; }

      try {
        await api.put(trimmed, '');
        lists.push(trimmed);
        renderTabs();
        await switchList(trimmed);
      } catch (e) {
        toast('Create error: ' + e.message);
      }
    });

    // ─── Delete list ─────────────────────────────────────────────────────────
    document.getElementById('delete-list-btn').addEventListener('click', async () => {
      if (!activeList) return;
      if (!confirm(`Delete "${activeList}"?\n\nThis cannot be undone.`)) return;
      const name = activeList;
      try {
        await api.delete(name);
        lists = lists.filter(l => l !== name);
        activeList = null;
        items = [];
        document.getElementById('active-title').textContent = '—';
        document.getElementById('add-btn').disabled = true;
        renderTabs();
        if (lists.length > 0) {
          await switchList(lists[0]);
        } else {
          document.getElementById('progress-wrap').style.display = 'none';
          setMain('<div class="empty"><div class="empty-icon">📋</div>No lists yet.<br>Tap "+ new list" to create one.</div>');
        }
      } catch (e) {
        toast('Delete error: ' + e.message);
      }
    });

    // ─── Helpers ─────────────────────────────────────────────────────────────
    function setMain(html) { document.getElementById('list').innerHTML = html; }

    function esc(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ─── Go ──────────────────────────────────────────────────────────────────
    init();
  </script>
</body>
</html>
